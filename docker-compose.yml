services:
  postgres:
    image: postgres:16-alpine
    container_name: open-shopify-db
    environment:
      POSTGRES_USER: openshopify
      POSTGRES_PASSWORD: openshopify
      POSTGRES_DB: openshopify
    ports:
      - "5432:5432"
    volumes:
      - open_shopify_pgdata:/var/lib/postgresql/data

volumes:
  open_shopify_pgdata:
