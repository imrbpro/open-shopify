name: openstore

services:
  app:
    build: .
    container_name: openstore
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/openstore.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - openstore_data:/data

volumes:
  openstore_data:
